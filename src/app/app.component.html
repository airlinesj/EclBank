<div class="main-layout">
  <!-- Sidebar Navigation -->
  <aside class="sidebar" [ngClass]="{'mobile-open': sidebarOpen}">
    <div class="sidebar-header">
      <span class="logo">₿</span>
      <span class="sidebar-title">{{ title }}</span>
    </div>

    <ul class="nav-menu">
      <li *ngFor="let item of navigation" 
          class="nav-item"
          [routerLinkActive]="'active'"
          (click)="closeSidebar()">
        <a [routerLink]="item.path" class="nav-link">
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <p class="text-sm text-light">Banking ECL v1.0</p>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Mobile Menu Toggle -->
    <button class="menu-toggle" (click)="toggleSidebar()" *ngIf="sidebarOpen === false">
      ☰
    </button>
    <button class="menu-toggle" (click)="closeSidebar()" *ngIf="sidebarOpen === true">
      ✕
    </button>

    <router-outlet></router-outlet>
  </div>
</div>
