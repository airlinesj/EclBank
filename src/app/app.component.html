<div class="main-layout" [class.sidebar-open]="sidebarOpen" *ngIf="!isLoginPage">
  <!-- Sidebar Backdrop (Mobile) -->
  <div class="sidebar-backdrop" *ngIf="sidebarOpen" (click)="closeSidebar()"></div>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" [class.mobile-open]="sidebarOpen" (click)="onSidebarClick($event)">
    <div class="sidebar-header">
      <div class="logo-img">
        <span class="material-symbols-outlined">account_balance</span>
      </div>
      <div class="sidebar-branding">
        <p class="nbs-text">NBS BANK</p>
        <p class="sidebar-title">Banking ECL</p>
      </div>
    </div>

    <ul class="nav-menu">
      <li *ngFor="let item of navigation" 
          class="nav-item"
          [routerLinkActive]="'active'"
          (click)="closeSidebar()">
        <a [routerLink]="item.path" class="nav-link">
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </li>
    </ul>

    <button class="logout-btn" (click)="logout()" [attr.aria-label]="'Logout'">
      <span class="material-symbols-outlined">logout</span>
      <span class="nav-text">Logout</span>
    </button>

    <div class="sidebar-footer">
      <p class="text-sm">Banking ECL v1.0</p>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Mobile Menu Toggle -->
    <button class="menu-toggle" (click)="toggleSidebar($event)" [attr.aria-label]="sidebarOpen ? 'Close menu' : 'Open menu'">
      <span class="material-symbols-outlined">{{ sidebarOpen ? 'close' : 'menu' }}</span>
    </button>

    <router-outlet></router-outlet>
  </div>
</div>

<!-- Login Page (no sidebar) -->
<router-outlet *ngIf="isLoginPage"></router-outlet>
